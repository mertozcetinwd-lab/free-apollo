name = "free-apollo"
main = "src/index.js"
compatibility_date = "2026-09-30"

# The app in /public is served for every path the Worker does not answer itself (/api/*).
# It is a single-page app, so an unknown path (e.g. /deals/12 on refresh) serves index.html.
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*"]
not_found_handling = "single-page-application"

# Create it with: npx wrangler d1 create free-apollo   then paste the database_id it prints here.
[[d1_databases]]
binding = "DB"
database_name = "free-apollo"
database_id = "PASTE_YOUR_DATABASE_ID_HERE"
